<!-- Interactive script for tactile counter demo -->
<script>
    (function() {
      let qty = 2;
      const display = document.getElementById('qty-display');
      const hint = document.getElementById('unit-hint');
      const btnDec = document.getElementById('btn-decrement');
      const btnInc = document.getElementById('btn-increment');

      btnDec.addEventListener('click', () => {
        if (qty > 1) {
          qty--;
          update();
        }
      });

      btnInc.addEventListener('click', () => {
        if (qty < 10) {
          qty++;
          update();
        }
      });

      function update() {
        display.textContent = qty;
        hint.textContent = qty + " JCB " + (qty === 1 ? "machine requested" : "machines requested");
      }
    })();
  </script>
