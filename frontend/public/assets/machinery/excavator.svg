<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <!-- Clean Isolated Heavy Excavator (Site Yellow & Charcoal) -->
  <rect width="200" height="150" fill="#F8F9FA" rx="12"/>
  <g transform="translate(15, 15)">
    <!-- Tracks / Undercarriage -->
    <rect x="25" y="88" width="85" height="22" rx="10" fill="#1C1C1E"/>
    <rect x="30" y="92" width="75" height="14" rx="7" fill="#3A3A3C"/>
    <!-- Wheels in tracks -->
    <circle cx="38" cy="99" r="5" fill="#1C1C1E"/>
    <circle cx="53" cy="99" r="5" fill="#1C1C1E"/>
    <circle cx="68" cy="99" r="5" fill="#1C1C1E"/>
    <circle cx="83" cy="99" r="5" fill="#1C1C1E"/>
    <circle cx="97" cy="99" r="5" fill="#1C1C1E"/>
    
    <!-- Rotating Platform / Turret -->
    <path d="M 28 88 L 32 64 L 95 64 L 102 88 Z" fill="#FFB400"/>
    <rect x="35" y="52" width="40" height="20" rx="3" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    <!-- Cabin Glass -->
    <path d="M 74 54 L 96 54 L 98 75 L 74 75 Z" fill="#E5F3FF" stroke="#1C1C1E" stroke-width="2"/>
    <!-- Counterweight -->
    <rect x="22" y="66" width="16" height="20" rx="3" fill="#1C1C1E"/>
    
    <!-- Boom (Main Arm) -->
    <path d="M 90 70 L 115 32 L 126 35 L 98 76 Z" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    <circle cx="94" cy="73" r="3.5" fill="#1C1C1E"/>
    
    <!-- Stick (Forearm) -->
    <path d="M 118 33 L 152 65 L 146 72 L 114 38 Z" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    <circle cx="118" cy="35" r="3.5" fill="#1C1C1E"/>
    
    <!-- Bucket -->
    <path d="M 148 68 L 165 72 L 158 92 L 140 85 Z" fill="#1C1C1E"/>
    <path d="M 158 92 L 162 96 L 154 94 L 149 97 L 145 93 Z" fill="#7E5700"/>
    
    <!-- Hydraulic Cylinders -->
    <line x1="80" y1="62" x2="108" y2="45" stroke="#71717A" stroke-width="3" stroke-linecap="round"/>
    <line x1="108" y1="45" x2="128" y2="52" stroke="#71717A" stroke-width="2" stroke-linecap="round"/>
  </g>
</svg>
