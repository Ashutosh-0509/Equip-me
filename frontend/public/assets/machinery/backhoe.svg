<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <!-- Clean Isolated JCB 3DX Backhoe Loader (Site Yellow & Charcoal) -->
  <rect width="200" height="150" fill="#F8F9FA" rx="12"/>
  <g transform="translate(15, 15)">
    <!-- Chassis & Body -->
    <rect x="50" y="70" width="65" height="24" rx="4" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    
    <!-- Operator Cabin -->
    <path d="M 68 44 L 92 44 L 98 70 L 62 70 Z" fill="#E5F3FF" stroke="#1C1C1E" stroke-width="2.5"/>
    <rect x="65" y="42" width="28" height="4" rx="1" fill="#FFB400"/>
    <line x1="78" y1="44" x2="76" y2="70" stroke="#1C1C1E" stroke-width="1.5"/>
    
    <!-- Large Rear Wheel -->
    <circle cx="58" cy="95" r="18" fill="#1C1C1E"/>
    <circle cx="58" cy="95" r="10" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    <circle cx="58" cy="95" r="3" fill="#1C1C1E"/>
    
    <!-- Front Wheel -->
    <circle cx="108" cy="100" r="13" fill="#1C1C1E"/>
    <circle cx="108" cy="100" r="7" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    <circle cx="108" cy="100" r="2.5" fill="#1C1C1E"/>
    
    <!-- Front Loader Arm & Bucket -->
    <path d="M 98 75 L 132 82 L 142 88 L 134 94 Z" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    <path d="M 136 76 L 158 84 L 152 104 L 134 98 Z" fill="#1C1C1E"/>
    <polygon points="152,104 158,108 148,106 142,108 138,105" fill="#7E5700"/>
    
    <!-- Rear Backhoe Boom & Bucket -->
    <path d="M 48 76 L 24 50 L 15 54 L 42 84 Z" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    <path d="M 20 52 L 8 78 L 14 82 L 28 58 Z" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    <path d="M 10 78 L 2 92 L 14 96 L 18 84 Z" fill="#1C1C1E"/>
    
    <!-- Exhaust Stack -->
    <rect x="94" y="36" width="3" height="18" fill="#1C1C1E" rx="1"/>
  </g>
</svg>
