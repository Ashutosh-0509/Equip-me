<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 150" width="100%" height="100%">
  <!-- Clean Isolated Hydra Crane (Site Yellow & Charcoal) -->
  <rect width="200" height="150" fill="#F8F9FA" rx="12"/>
  <g transform="translate(15, 15)">
    <!-- Chassis -->
    <rect x="25" y="80" width="115" height="16" rx="4" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    
    <!-- Operator Cabin (Rear mounted) -->
    <path d="M 32 54 L 56 54 L 60 80 L 30 80 Z" fill="#E5F3FF" stroke="#1C1C1E" stroke-width="2"/>
    <rect x="30" y="50" width="28" height="4" fill="#FFB400" rx="1"/>
    
    <!-- Telescopic Crane Boom (Extending diagonally) -->
    <path d="M 52 74 L 145 32 L 150 40 L 56 82 Z" fill="#FFB400" stroke="#1C1C1E" stroke-width="2"/>
    <!-- Inner Extension Stage -->
    <path d="M 135 36 L 168 22 L 172 27 L 140 42 Z" fill="#1C1C1E"/>
    
    <!-- Pulley & Hook at Boom Tip -->
    <circle cx="170" cy="25" r="3" fill="#FFB400"/>
    <line x1="170" y1="28" x2="170" y2="48" stroke="#1C1C1E" stroke-width="1.5"/>
    <path d="M 166 48 C 166 54, 174 54, 174 48" fill="none" stroke="#1C1C1E" stroke-width="2"/>
    
    <!-- Hydraulic Lift Cylinder -->
    <line x1="75" y1="80" x2="100" y2="52" stroke="#71717A" stroke-width="3.5" stroke-linecap="round"/>
    
    <!-- Outriggers (Stabilizers) -->
    <rect x="26" y="86" width="6" height="14" fill="#1C1C1E"/>
    <rect x="128" y="86" width="6" height="14" fill="#1C1C1E"/>
    
    <!-- Front Wheels -->
    <circle cx="120" cy="98" r="14" fill="#1C1C1E"/>
    <circle cx="120" cy="98" r="7" fill="#FFB400" stroke="#1C1C1E" stroke-width="1.5"/>
    <circle cx="120" cy="98" r="2.5" fill="#1C1C1E"/>
    
    <!-- Rear Wheels -->
    <circle cx="48" cy="98" r="14" fill="#1C1C1E"/>
    <circle cx="48" cy="98" r="7" fill="#FFB400" stroke="#1C1C1E" stroke-width="1.5"/>
    <circle cx="48" cy="98" r="2.5" fill="#1C1C1E"/>
  </g>
</svg>
